<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f5f4; }
    .navbar {
      background: #1c2528;
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      border-bottom: 2px solid #2f6f75;
    }
    .tab-btn {
      background: #2c3739;
      color: #9aa9ab;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn:hover { background: #3a484b; color: #fff; }
    .tab-btn.active { background: #2f6f75; color: #ffffff; }
    .tab-content { display: none; width: 100%; height: calc(100vh - 55px); }
    .tab-content.active { display: block; }
    iframe { width: 100%; height: 100%; border: none; }
    .coming-soon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #59666a;
      font-size: 18px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="tab-btn active" onclick="openTab(event, 'tab-kpi')">PJP KPI Report</button>
    <button class="tab-btn" onclick="openTab(event, 'tab-project2')">Project 2 (Coming Soon)</button>
  </div>

  <div id="tab-kpi" class="tab-content active">
    <iframe src="kpi-tool.html"></iframe>
  </div>

  <div id="tab-project2" class="tab-content">
    <div class="coming-soon">
      <p>🚀 Project 2 is Coming Soon. Stay tuned!</p>
    </div>
  </div>

  <script>
    function openTab(evt, tabName) {
      var contents = document.getElementsByClassName("tab-content");
      for (var i = 0; i < contents.length; i++) { contents[i].classList.remove("active"); }
      var buttons = document.getElementsByClassName("tab-btn");
      for (var i = 0; i < buttons.length; i++) { buttons[i].classList.remove("active"); }
      document.getElementById(tabName).classList.add("active");
      evt.currentTarget.classList.add("active");
    }
  </script>
</body>
</html>
